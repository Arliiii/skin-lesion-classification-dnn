project:
  seed: 42
  device: auto

data:
  synthetic: false
  raw_dir: data/raw/archive_2
  processed_dir: data/processed_lesion
  metadata_file: HAM10000_metadata.csv
  image_dirs:
    - HAM10000_images_part_1
    - HAM10000_images_part_2
  image_size: 299
  batch_size: 16
  num_workers: 0
  val_size: 0.15
  test_size: 0.15
  regenerate_splits: true
  group_by: lesion_id
  balanced_sampler: true
  sampler_weight_power: 0.5
  classes:
    - nv
    - mel
    - bkl
    - bcc
    - akiec
    - vasc
    - df

model:
  name: resnet50_multiscale_attention
  num_classes: 7
  pretrained: true
  head_channels: 128
  fusion_channels: 256
  dropout: 0.3

training:
  epochs: 40
  learning_rate: 0.0001
  weight_decay: 0.0002
  loss: class_balanced_focal
  class_balanced_beta: 0.999
  focal_gamma: 2.0
  label_smoothing: 0.05
  backbone_learning_rate: 0.00001
  head_learning_rate: 0.0001
  freeze_backbone_epochs: 2
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 2
  early_stopping: true
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0005

outputs:
  checkpoint_dir: outputs/checkpoints
  figure_dir: outputs/figures
  log_dir: outputs/logs
