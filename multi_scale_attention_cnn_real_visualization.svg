<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ResNet-50 Multi-Scale Attention CNN Pipeline</title>
  <desc id="desc">Article-ready diagram showing the updated HAM10000 skin lesion classification pipeline with train-only balanced sampling, class-balanced focal loss, ImageNet-pretrained ResNet-50, a custom multi-scale attention head, frozen-backbone warmup with differential learning rates, and seven-class output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#243044"/>
    </marker>
    <linearGradient id="lesionGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7d7b6"/>
      <stop offset="45%" stop-color="#d28a72"/>
      <stop offset="100%" stop-color="#62333b"/>
    </linearGradient>
    <linearGradient id="featureGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="classGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, Helvetica, sans-serif; fill: #64748b; }
      .section-label { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .block-title { font: 700 17px Arial, Helvetica, sans-serif; fill: #111827; letter-spacing: 0; }
      .block-text { font: 400 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .micro { font: 700 11px Arial, Helvetica, sans-serif; fill: #64748b; }
      .tiny { font: 400 11px Arial, Helvetica, sans-serif; fill: #64748b; }
      .badge-text { font: 700 11px Arial, Helvetica, sans-serif; fill: #1e293b; }
      .axis-text { font: 700 12px Arial, Helvetica, sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 1.5; filter: url(#softShadow); }
      .panel-soft { fill: #f8fafc; stroke: #d8dee8; stroke-width: 1.2; }
      .data-panel { fill: #fff7ed; stroke: #f59e0b; }
      .pre-panel { fill: #ecfeff; stroke: #0891b2; }
      .resnet-panel { fill: #eff6ff; stroke: #2563eb; }
      .head-panel { fill: #f0fdf4; stroke: #16a34a; }
      .train-panel { fill: #f8fafc; stroke: #64748b; }
      .output-panel { fill: #f7fee7; stroke: #65a30d; }
      .badge { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .arrow { stroke: #243044; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .connector { stroke: #64748b; stroke-width: 1.7; fill: none; }
      .skip { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
      .feature-map { fill: url(#featureGrad); stroke: #2563eb; }
      .stage-a { fill: #dbeafe; stroke: #2563eb; }
      .stage-b { fill: #e0f2fe; stroke: #0284c7; }
      .stage-c { fill: #dcfce7; stroke: #16a34a; }
      .stage-d { fill: #fef3c7; stroke: #d97706; }
      .stage-e { fill: #fce7f3; stroke: #db2777; }
      .class-bar { fill: url(#classGrad); stroke: #16a34a; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="980"/>

  <text x="800" y="48" text-anchor="middle" class="title">ResNet-50 Multi-Scale Attention CNN Pipeline</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">Balanced train sampling, class-balanced focal loss, ImageNet ResNet-50, custom attention head, warmup, and seven-class softmax</text>
  <line x1="94" y1="112" x2="1506" y2="112" stroke="#e2e8f0" stroke-width="1"/>

  <text x="168" y="135" text-anchor="middle" class="section-label">Dataset Protocol</text>
  <text x="388" y="135" text-anchor="middle" class="section-label">Image Pipeline</text>
  <text x="713" y="135" text-anchor="middle" class="section-label">Pretrained ResNet-50 Backbone</text>
  <text x="1115" y="135" text-anchor="middle" class="section-label">Multi-Scale Attention Head</text>
  <text x="1434" y="135" text-anchor="middle" class="section-label">Prediction</text>

  <g transform="translate(72,188)">
    <rect x="0" y="0" width="198" height="590" rx="18" class="panel data-panel"/>
    <text x="99" y="38" text-anchor="middle" class="block-title">HAM10000</text>
    <text x="99" y="62" text-anchor="middle" class="block-text">10015 RGB lesion images</text>

    <g transform="translate(43,92)">
      <rect x="0" y="0" width="112" height="112" rx="16" fill="url(#lesionGrad)" stroke="#7c2d12" stroke-width="1.7"/>
      <ellipse cx="56" cy="58" rx="37" ry="43" fill="#4a1f25" opacity="0.72"/>
      <ellipse cx="64" cy="51" rx="18" ry="14" fill="#8b3f43" opacity="0.75"/>
      <circle cx="76" cy="69" r="12" fill="#f0c29b" opacity="0.42"/>
      <path d="M 28 54 C 36 36, 64 32, 84 47 C 98 58, 94 82, 76 94 C 56 107, 30 88, 28 54 Z" fill="none" stroke="#fef3c7" stroke-width="1.2" opacity="0.42"/>
    </g>

    <g transform="translate(22,270)">
      <rect x="0" y="0" width="154" height="144" rx="13" fill="#ffffff" stroke="#fed7aa" stroke-width="1.2"/>
      <text x="77" y="28" text-anchor="middle" class="micro">Class labels</text>
      <text x="24" y="59" class="tiny">nv</text>
      <text x="24" y="82" class="tiny">mel</text>
      <text x="24" y="105" class="tiny">bkl</text>
      <text x="82" y="59" class="tiny">bcc</text>
      <text x="82" y="82" class="tiny">akiec</text>
      <text x="82" y="105" class="tiny">vasc / df</text>
      <text x="77" y="129" text-anchor="middle" class="tiny">7-way classification</text>
    </g>
  </g>

  <path d="M 270 483 L 318 483" class="arrow"/>

  <g transform="translate(318,188)">
    <rect x="0" y="0" width="210" height="590" rx="18" class="panel pre-panel"/>
    <text x="105" y="38" text-anchor="middle" class="block-title">Input Pipeline</text>
    <text x="105" y="62" text-anchor="middle" class="block-text">ResNet-compatible tensors</text>

    <g transform="translate(28,98)">
      <rect x="0" y="0" width="154" height="86" rx="13" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.2"/>
      <text x="77" y="28" text-anchor="middle" class="micro">Preprocessing</text>
      <text x="77" y="52" text-anchor="middle" class="block-text">299 x 299 resize</text>
      <text x="77" y="72" text-anchor="middle" class="tiny">ImageNet normalization</text>
    </g>

    <path d="M 105 196 L 105 238" class="thin-arrow"/>

    <g transform="translate(28,248)">
      <rect x="0" y="0" width="154" height="132" rx="13" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.2"/>
      <text x="77" y="28" text-anchor="middle" class="micro">Train augmentation</text>
      <text x="77" y="56" text-anchor="middle" class="block-text">horizontal / vertical flip</text>
      <text x="77" y="80" text-anchor="middle" class="block-text">rotation, color jitter, erasing</text>
      <text x="77" y="108" text-anchor="middle" class="tiny">validation and test stay deterministic</text>
    </g>

    <path d="M 105 392 L 105 434" class="thin-arrow"/>

    <g transform="translate(28,444)">
      <rect x="0" y="0" width="154" height="86" rx="13" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.2"/>
      <text x="77" y="28" text-anchor="middle" class="micro">Train loader</text>
      <text x="77" y="52" text-anchor="middle" class="block-text">balanced sampler</text>
      <text x="77" y="72" text-anchor="middle" class="tiny">sampler weight power 0.5</text>
    </g>
  </g>

  <path d="M 528 483 L 578 483" class="arrow"/>

  <g transform="translate(578,188)">
    <rect x="0" y="0" width="270" height="590" rx="18" class="panel resnet-panel"/>
    <text x="135" y="38" text-anchor="middle" class="block-title">ImageNet ResNet-50</text>
    <text x="135" y="62" text-anchor="middle" class="block-text">pretrained CNN backbone</text>

    <g transform="translate(78,104)">
      <rect x="18" y="18" width="96" height="78" rx="10" class="feature-map" opacity="0.35"/>
      <rect x="9" y="9" width="96" height="78" rx="10" class="feature-map" opacity="0.65"/>
      <rect x="0" y="0" width="96" height="78" rx="10" class="feature-map"/>
      <path d="M 18 18 H 78 M 18 39 H 78 M 18 60 H 78 M 38 9 V 69 M 60 9 V 69" stroke="#60a5fa" stroke-width="1" opacity="0.85"/>
    </g>

    <g transform="translate(30,246)">
      <rect x="0" y="0" width="210" height="116" rx="14" class="stage-a"/>
      <text x="105" y="35" text-anchor="middle" class="block-title">Feature Extractor</text>
      <text x="105" y="63" text-anchor="middle" class="block-text">single ResNet-50 block</text>
      <text x="105" y="88" text-anchor="middle" class="tiny">outputs 2048 channels</text>
    </g>

    <g transform="translate(30,430)">
      <rect x="0" y="0" width="210" height="92" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.2"/>
      <text x="105" y="29" text-anchor="middle" class="micro">Fine-tuning strategy</text>
      <text x="105" y="54" text-anchor="middle" class="block-text">first 2 epochs frozen</text>
      <text x="105" y="74" text-anchor="middle" class="tiny">then lower backbone LR</text>
    </g>
  </g>

  <path d="M 848 483 L 900 483" class="arrow"/>

  <g transform="translate(900,188)">
    <rect x="0" y="0" width="430" height="590" rx="18" class="panel head-panel"/>
    <text x="215" y="38" text-anchor="middle" class="block-title">Multi-Scale Attention Head</text>
    <text x="215" y="62" text-anchor="middle" class="block-text">custom project contribution after ResNet-50</text>

    <g transform="translate(72,90)">
      <rect x="0" y="0" width="286" height="58" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="143" y="25" text-anchor="middle" class="micro">Input feature map</text>
      <text x="143" y="44" text-anchor="middle" class="tiny">2048-channel ResNet representation</text>
    </g>

    <text x="215" y="181" text-anchor="middle" class="micro">Parallel convolution branches</text>

    <g transform="translate(24,198)">
      <rect x="0" y="0" width="122" height="104" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="61" y="28" text-anchor="middle" class="micro">3x3 Conv</text>
      <text x="61" y="53" text-anchor="middle" class="tiny">local texture</text>
      <text x="61" y="75" text-anchor="middle" class="tiny">128 channels</text>
    </g>

    <g transform="translate(154,198)">
      <rect x="0" y="0" width="122" height="104" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="61" y="28" text-anchor="middle" class="micro">5x5 Conv</text>
      <text x="61" y="53" text-anchor="middle" class="tiny">wider lesion shape</text>
      <text x="61" y="75" text-anchor="middle" class="tiny">128 channels</text>
    </g>

    <g transform="translate(284,198)">
      <rect x="0" y="0" width="122" height="104" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="61" y="28" text-anchor="middle" class="micro">Dilated 3x3</text>
      <text x="61" y="53" text-anchor="middle" class="tiny">larger context</text>
      <text x="61" y="75" text-anchor="middle" class="tiny">128 channels</text>
    </g>

    <path d="M 215 302 L 215 332" class="thin-arrow"/>

    <g transform="translate(64,342)">
      <rect x="0" y="0" width="302" height="58" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="151" y="24" text-anchor="middle" class="micro">Concatenate branches</text>
      <text x="151" y="43" text-anchor="middle" class="tiny">3 x 128 = 384 channels</text>
    </g>

    <path d="M 215 400 L 215 428" class="thin-arrow"/>

    <g transform="translate(64,438)">
      <rect x="0" y="0" width="302" height="70" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
      <text x="151" y="25" text-anchor="middle" class="micro">CBAM attention</text>
      <text x="151" y="46" text-anchor="middle" class="tiny">channel attention + spatial attention</text>
      <text x="151" y="60" text-anchor="middle" class="tiny">reweights lesion evidence</text>
    </g>

    <path d="M 215 508 L 215 532" class="thin-arrow"/>

    <g transform="translate(64,542)">
      <rect x="0" y="0" width="302" height="40" rx="13" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="151" y="25" text-anchor="middle" class="tiny">1x1 fusion: 384 -> 256, GAP, dropout, dense 7</text>
    </g>
  </g>

  <path d="M 1330 483 L 1364 483" class="arrow"/>

  <g transform="translate(1364,188)">
    <rect x="0" y="0" width="164" height="590" rx="18" class="panel output-panel"/>
    <text x="82" y="38" text-anchor="middle" class="block-title">Output</text>
    <text x="82" y="62" text-anchor="middle" class="block-text">7 probabilities</text>

    <g transform="translate(28,106)">
      <rect x="0" y="0" width="108" height="86" rx="14" fill="#ffffff" stroke="#d9f99d" stroke-width="1.2"/>
      <text x="54" y="29" text-anchor="middle" class="micro">Softmax</text>
      <text x="54" y="54" text-anchor="middle" class="block-text">class scores</text>
    </g>

    <path d="M 82 204 L 82 246" class="thin-arrow"/>

    <g transform="translate(28,256)">
      <rect x="0" y="0" width="108" height="242" rx="14" fill="#ffffff" stroke="#d9f99d" stroke-width="1.2"/>
      <text x="54" y="28" text-anchor="middle" class="micro">Classes</text>
      <text x="24" y="62" class="tiny">nv</text>
      <text x="24" y="88" class="tiny">mel</text>
      <text x="24" y="114" class="tiny">bkl</text>
      <text x="24" y="140" class="tiny">bcc</text>
      <text x="24" y="166" class="tiny">akiec</text>
      <text x="24" y="192" class="tiny">vasc</text>
      <text x="24" y="218" class="tiny">df</text>
    </g>
  </g>

  <g transform="translate(332,850)">
    <rect x="0" y="0" width="936" height="66" rx="16" class="panel-soft"/>
    <text x="24" y="25" class="axis-text">Tensor and training flow</text>
    <text x="24" y="46" class="tiny">299 x 299 x 3 image</text>
    <path d="M 144 33 H 220" class="skip" marker-end="url(#arrow)"/>
    <text x="240" y="25" class="axis-text">ResNet-50 features</text>
    <text x="240" y="46" class="tiny">warmup then lower-LR fine-tuning</text>
    <path d="M 398 33 H 474" class="skip" marker-end="url(#arrow)"/>
    <text x="494" y="25" class="axis-text">multi-scale attention</text>
    <text x="494" y="46" class="tiny">3 branches + CBAM masks</text>
    <path d="M 650 33 H 726" class="skip" marker-end="url(#arrow)"/>
    <text x="746" y="25" class="axis-text">best checkpoint</text>
    <text x="746" y="46" class="tiny">selected by validation macro F1</text>
  </g>
</svg>
